name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Biome Check
        run: npx @biomejs/biome check src/api.js src/app-settings.js src/app.js src/scoring.js src/storage.js src/store.js src/utils.js src/validator.js index.html style.css sw.js tests/

      - name: TypeScript Check
        run: npx tsc --noEmit --allowJs --checkJs src/**/*.js

      - name: Run Vitest
        run: npm test -- --run

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
