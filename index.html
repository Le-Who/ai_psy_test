<!doctype html>
<html lang="ru">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Figtree:wght@400..700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@400..700&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..800&family=Sora:wght@400..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Universal Test Generator</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="AI Universal Test Generator" />
    <meta
      name="description"
      content="Создайте уникальный психологический тест, типологию или викторину за секунды с помощью генеративного ИИ. Мгновенные результаты и глубокая аналитика."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ai-psy-test.vercel.app/" />
    <meta property="og:title" content="AI Universal Test Generator" />
    <meta
      property="og:description"
      content="Создайте уникальный психологический тест, типологию или викторину за секунды с помощью генеративного ИИ. Мгновенные результаты и глубокая аналитика."
    />
    <!-- Placeholder image, user should replace with actual screenshot/banner -->
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1620025402094-142fbf57620f?q=80&w=1200"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ai-psy-test.vercel.app/" />
    <meta property="twitter:title" content="AI Universal Test Generator" />
    <meta
      property="twitter:description"
      content="Создайте уникальный психологический тест, типологию или викторину за секунды с помощью генеративного ИИ. Мгновенные результаты и глубокая аналитика."
    />
    <meta
      property="twitter:image"
      content="https://images.unsplash.com/photo-1620025402094-142fbf57620f?q=80&w=1200"
    />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="theme-color" content="#6366f1" />

    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <div class="header-row" style="margin-top: 5vh; margin-bottom: 3vh">
        <div
          class="header-content"
          style="display: flex; flex-direction: column-reverse"
        >
          <h1
            style="cursor: pointer; margin-top: 10px"
            onclick="location.reload()"
            title="Дом Дуни"
          >
            🔮
            <span class="header-title-text"
              >Генератор Тестов им. Дуни Пахучей</span
            >
            💅
          </h1>
          <p style="margin-bottom: 0">Работает на хлопьях с молоком 🥣</p>
        </div>

        <button
          type="button"
          class="theme-toggle-btn"
          onclick="toggleThemeMenu()"
          title="Темы"
          aria-label="Переключить тему"
          aria-expanded="false"
        >
          🎨
        </button>
        <div class="theme-menu" id="themeMenu">
          <button type="button" class="theme-opt" onclick="setTheme('prof')">
            <div
              class="theme-circle"
              style="background: #3b2314; border: 1px solid #6b5744"
            ></div>
            Кабинет
          </button>
          <button type="button" class="theme-opt" onclick="setTheme('youth')">
            <div
              class="theme-circle"
              style="
                background: linear-gradient(135deg, #c4b5fd, #fdba74);
                border: 1px solid #c4b5fd;
              "
            ></div>
            Вайб
          </button>
          <button type="button" class="theme-opt" onclick="setTheme('candy')">
            <div
              class="theme-circle"
              style="background: #fbcfe8; border: 1px solid #f9a8d4"
            ></div>
            Облака
          </button>
          <button type="button" class="theme-opt" onclick="setTheme('avant')">
            <div
              class="theme-circle"
              style="background: #000000; border: 1px solid #ff6b00"
            ></div>
            Авангард
          </button>
        </div>
      </div>

      <div
        id="errorBox"
        style="
          background: #fef2f2;
          color: #991b1b;
          padding: 15px;
          border-radius: 12px;
          display: none;
          margin-bottom: 20px;
          border: 1px solid #fecaca;
        "
      ></div>

      <!-- 1. SETUP VIEW -->
      <div id="setupView" class="view active">
        <div
          style="display: flex; justify-content: flex-end; margin-bottom: 10px"
        >
          <button type="button" onclick="app.openLibrary()" class="btn-text">
            📂 Библиотека
          </button>
        </div>

        <div class="card">
          <div class="card-header-row">
            <div class="mode-tabs" style="margin-left: auto">
              <button
                type="button"
                class="mode-tab active"
                id="tabPsy"
                onclick="app.setMode('psy')"
              >
                Тестикул
              </button>
              <button
                type="button"
                class="mode-tab"
                id="tabQuiz"
                onclick="app.setMode('quiz')"
              >
                Виктория
              </button>
            </div>
          </div>

          <form onsubmit="app.start(event)" novalidate>
            <label for="themeInput"
              >Тема
              <span
                class="text-danger"
                style="margin-left: 3px"
                aria-hidden="true"
                >*</span
              ></label
            >
            <input
              type="text"
              id="themeInput"
              placeholder="Например: Какой ты хлебушек?"
              required
            />

            <label for="notesInput"
              >Уточнения
              <span style="font-weight: normal; opacity: 0.7; font-size: 12px"
                >(опционально)</span
              ></label
            >
            <textarea
              id="notesInput"
              rows="2"
              style="
                width: 100%;
                padding: 12px;
                margin-top: 8px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--bg);
                color: var(--text);
                font-family: inherit;
                resize: vertical;
              "
              placeholder="Сделай смешным, для программистов..."
            ></textarea>

            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
            >
              <div id="audienceGroup">
                <label for="audienceInput">Аудитория</label>
                <input
                  type="text"
                  id="audienceInput"
                  list="audienceOptions"
                  value=""
                  placeholder="Подростки?"
                />
                <datalist id="audienceOptions">
                  <option value="Дети (до 12 лет)"></option>
                  <option value="Подростки (13-17 лет)"></option>
                  <option value="Студенты и зумеры"></option>
                  <option value="Взрослые (строгий тон)"></option>
                  <option value="Айтишники и технари"></option>
                  <option value="Миллениалы (ностальгия)"></option>
                  <option value="Пенсионеры"></option>
                </datalist>
              </div>
              <div id="difficultyGroup" style="display: none">
                <label for="difficultyInput">Вариантов ответа</label>
                <select id="difficultyInput">
                  <option value="2">2 (Да/Нет)</option>
                  <option value="3">3 (Легко)</option>
                  <option value="4" selected>4 (Стандарт)</option>
                </select>
              </div>

              <div>
                <label for="qCountInput">Вопросов</label>
                <select id="qCountInput">
                  <option value="5">5</option>
                  <option value="10" selected>10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="30">30</option>
                  <option value="50">50</option>
                  <option value="69">Тумач.</option>
                </select>
              </div>
            </div>

            <label for="apiKeyInput"
              >API Ключ
              <span
                class="text-danger"
                style="margin-left: 3px"
                aria-hidden="true"
                >*</span
              ></label
            >
            <div class="input-group">
              <input
                type="password"
                id="apiKeyInput"
                placeholder="sk-or-... / AIza..."
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-action="togglePassword"
                data-target="apiKeyInput"
                aria-label="Показать API ключ"
              >
                👁️
              </button>
            </div>

            <button
              type="submit"
              class="btn primary-btn"
              style="margin-top: 25px"
            >
              🚀 Сгенерировать
            </button>
          </form>
        </div>
      </div>

      <!-- 2. LIBRARY VIEW -->
      <div id="libraryView" class="view">
        <div style="margin-bottom: 20px">
          <button type="button" data-action="closeLibrary" class="btn-text">
            ← Назад
          </button>
        </div>
        <h2>Ваши тесты</h2>
        <div id="libraryContent"></div>
        <!-- ВАЖНО: ID libraryContent -->
      </div>

      <!-- 3. DUEL VIEW (Экран вызова) -->
      <div
        id="duelView"
        class="container"
        style="display: none; text-align: center; padding-top: 50px"
      >
        <div style="font-size: 60px">⚔️</div>
        <h1 style="color: var(--primary); margin-bottom: 10px">
          ВЫЗОВ ПРИНЯТ?
        </h1>
        <p
          style="font-size: 18px; color: var(--text-muted); margin-bottom: 30px"
        >
          Пользователь
          <strong id="duelHostName" style="color: #fff">...</strong> набрал
          <strong id="duelHostScore" style="color: var(--accent)">...</strong>
          баллов. <br />Сможешь его победить?
        </p>

        <div class="card" style="margin-bottom: 30px; text-align: left">
          <h3 id="duelThemeTitle" style="margin-top: 0">Тема...</h3>
          <p>Вопросов: <span id="duelQCount">...</span></p>
        </div>

        <button
          type="button"
          class="btn"
          data-action="startDuel"
          style="font-size: 20px; padding: 15px 40px"
        >
          🚀 ПРИНЯТЬ БОЙ
        </button>
      </div>

      <!-- 4. TEST VIEW -->
      <div id="testView" class="view">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
          "
        >
          <button
            type="button"
            id="backBtn"
            class="btn-back"
            data-action="prevQuestion"
          >
            ← Назад
          </button>
          <div
            style="color: var(--text-muted); font-size: 13px; font-weight: 600"
          >
            ВОПРОС <span id="qNum">1</span>
          </div>
        </div>

        <div class="progress-div">
          <div
            id="progressBar"
            class="bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
        </div>

        <div class="card">
          <h3
            id="qText"
            style="font-size: 22px; margin-bottom: 30px; line-height: 1.4"
          >
            ...
          </h3>

          <!-- PSY (Likert 1-5) -->
          <div id="psyContainer" class="likert-grid">
            <button
              type="button"
              class="likert-opt"
              data-value="1"
              aria-label="Оценка 1: Совсем не про меня"
              aria-pressed="false"
            >
              <span>1</span><span>Совсем не про меня 🤬</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="2"
              aria-label="Оценка 2: Скорее не согласен"
              aria-pressed="false"
            >
              <span>2</span><span>Скорее не согласен 👎</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="3"
              aria-label="Оценка 3: Нейтрально"
              aria-pressed="false"
            >
              <span>3</span><span>Нейтрально 😐</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="4"
              aria-label="Оценка 4: Скорее согласен"
              aria-pressed="false"
            >
              <span>4</span><span>Скорее согласен 👍</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="5"
              aria-label="Оценка 5: Очень про меня"
              aria-pressed="false"
            >
              <span>5</span><span>Очень про меня 😍</span>
            </button>
          </div>

          <!-- QUIZ (Grid) -->
          <div id="quizContainer" class="quiz-grid" style="display: none"></div>
        </div>

        <div
          id="inProgressActions"
          style="
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 18px;
          "
        >
          <button
            type="button"
            id="inProgressSaveBtn"
            class="btn"
            data-action="saveTestBtn"
            style="flex: 1"
          >
            Сохранить тест
          </button>
          <button
            type="button"
            id="inProgressShareBtn"
            class="btn btn-accent"
            data-action="createShareLink"
            style="flex: 1"
          >
            Создать дуэль-ссылку
          </button>
        </div>

        <!-- Кнопку "Далее" убрали совсем, так как теперь везде авто-переход -->
      </div>

      <!-- 5. RESULTS VIEW -->
      <div id="resultsView" class="view">
        <div class="card" id="resContent"></div>

        <div style="text-align: center; margin-top: 20px">
          <button type="button" class="btn-text" onclick="location.reload()">
            ↺ Создать новый
          </button>
        </div>
      </div>
      <div id="toast">Ссылка скопирована! 📋</div>
    </div>

    <!-- СКРИПТЫ -->
    <script type="module" src="./src/app.js"></script>

    <!-- UI Scripts -->
    <script>
      function toggleThemeMenu() {
        const menu = document.getElementById("themeMenu");
        const btn = document.querySelector(".theme-toggle-btn");
        const isActive = menu.classList.toggle("active");

        if (btn) btn.setAttribute("aria-expanded", isActive);

        if (isActive) {
          const firstBtn = menu.querySelector("button");
          if (firstBtn) firstBtn.focus();

          setTimeout(
            () => document.addEventListener("click", closeMenuOutside),
            10,
          );
          document.addEventListener("keydown", handleMenuKeydown);
        } else {
          cleanupMenuListeners();
          if (btn) btn.focus();
        }
      }

      function cleanupMenuListeners() {
        document.removeEventListener("click", closeMenuOutside);
        document.removeEventListener("keydown", handleMenuKeydown);
      }

      function closeMenuOutside(e) {
        if (
          !e.target.closest(".theme-menu") &&
          !e.target.closest(".theme-toggle-btn")
        ) {
          closeThemeMenu();
        }
      }

      function handleMenuKeydown(e) {
        if (e.key === "Escape") {
          closeThemeMenu();
        }
      }

      function closeThemeMenu() {
        const menu = document.getElementById("themeMenu");
        const btn = document.querySelector(".theme-toggle-btn");
        if (!menu.classList.contains("active")) return;

        menu.classList.remove("active");
        if (btn) {
          btn.setAttribute("aria-expanded", "false");
          btn.focus();
        }
        cleanupMenuListeners();
      }

      function setTheme(themeName) {
        document.body.setAttribute("data-theme", themeName);
        localStorage.setItem("user-theme", themeName);
        closeThemeMenu();
      }

      function initTheme() {
        const saved = localStorage.getItem("user-theme") || "candy";
        document.body.setAttribute("data-theme", saved);
      }
      initTheme();

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.log("SW registration failed: ", err);
          });
        });
      }
    </script>

    <!-- ОВЕРЛЕЙ ЗАГРУЗКИ (Должен быть в конце body) -->
    <div
      id="loadingOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="loadingText"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
      "
    >
      <div class="loader" style="font-size: 50px; margin-bottom: 20px">🐒</div>
      <h2 id="loadingText" aria-live="assertive">Думаем...</h2>
    </div>
  </body>
</html>
