<!doctype html>
<html lang="ru">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assessment Protocol</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="AI Assessment Protocol" />
    <meta
      name="description"
      content="Generate deep psychological profiles, typologies, and precise knowledge assessments using predictive language models."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ai-psy-test.vercel.app/" />
    <meta property="og:title" content="AI Assessment Protocol" />
    <meta
      property="og:description"
      content="Generate deep psychological profiles, typologies, and precise knowledge assessments using predictive language models."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1617791160536-598cf32026fb?q=80&w=1200"
    />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="theme-color" content="#050505" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
      <!-- HEADER -->
      <div class="header-row">
        <div class="header-content">
          <h1 style="cursor: pointer" onclick="location.reload()" title="Home">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="header-icon"
              aria-hidden="true"
            >
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
              />
            </svg>
            <span class="header-title-text">Aether Assessments</span>
          </h1>
          <p>Powered by Advanced Generative AI</p>
        </div>

        <button
          type="button"
          class="theme-toggle-btn"
          onclick="toggleThemeMenu()"
          title="Appearance"
          aria-label="Toggle Theme"
          aria-expanded="false"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
        <div class="theme-menu" id="themeMenu">
          <button type="button" class="theme-opt" onclick="setTheme('dark')">
            <div
              class="theme-circle"
              style="
                background: #050505;
                border-color: rgba(255, 255, 255, 0.2);
              "
            ></div>
            Obsidian (Default)
          </button>
          <button type="button" class="theme-opt" onclick="setTheme('light')">
            <div
              class="theme-circle"
              style="background: #ffffff; border-color: #d4d4d8"
            ></div>
            Alabaster
          </button>
        </div>
      </div>

      <div
        id="errorBox"
        class="alert-box alert-error"
        style="display: none"
      ></div>

      <!-- 1. SETUP VIEW -->
      <div id="setupView" class="view active">
        <div class="view-actions">
          <button type="button" onclick="app.openLibrary()" class="btn-text">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"
              />
            </svg>
            Library
          </button>
        </div>

        <div class="card">
          <div class="card-header-row">
            <h2 class="card-title">Create Assessment</h2>
            <div class="mode-tabs">
              <button
                type="button"
                class="mode-tab active"
                id="tabPsy"
                onclick="app.setMode('psy')"
              >
                Psychometrics
              </button>
              <button
                type="button"
                class="mode-tab"
                id="tabQuiz"
                onclick="app.setMode('quiz')"
              >
                Knowledge Quiz
              </button>
            </div>
          </div>

          <form onsubmit="app.start(event)" novalidate>
            <label
              >Subject Topic
              <span class="text-danger" aria-hidden="true">*</span></label
            >
            <input
              type="text"
              id="themeInput"
              placeholder="e.g., Cognitive Bias Tendencies, Python Async"
              required
            />

            <label
              >Refinements <span class="label-optional">(optional)</span></label
            >
            <textarea
              id="notesInput"
              rows="2"
              class="form-textarea"
              placeholder="Provide specific context or tone instructions..."
            ></textarea>

            <div class="grid-2-cols">
              <div id="audienceGroup">
                <label>Target Audience</label>
                <input
                  type="text"
                  id="audienceInput"
                  value=""
                  placeholder="e.g., Professionals"
                />
              </div>
              <div id="difficultyGroup" style="display: none">
                <label>Options Density</label>
                <select id="difficultyInput">
                  <option value="2">2 (Binary)</option>
                  <option value="3">3 (Core)</option>
                  <option value="4" selected>4 (Standard)</option>
                </select>
              </div>

              <div>
                <label>Question Count</label>
                <select id="qCountInput">
                  <option value="5">5</option>
                  <option value="10" selected>10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="30">30</option>
                  <option value="50">50</option>
                  <option value="69">100 (Advanced)</option>
                </select>
              </div>
            </div>

            <label
              >Provider API Key
              <span class="text-danger" aria-hidden="true">*</span></label
            >
            <div class="input-group">
              <input
                type="password"
                id="apiKeyInput"
                placeholder="sk-or-... / AIza..."
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-action="togglePassword"
                data-target="apiKeyInput"
                aria-label="Toggle visibility"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>

            <button type="submit" class="btn primary-btn btn-spaced">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"
                />
              </svg>
              Initialize Assessment
            </button>
          </form>
        </div>
      </div>

      <!-- 2. LIBRARY VIEW -->
      <div id="libraryView" class="view">
        <div class="view-actions view-actions-left">
          <button type="button" data-action="closeLibrary" class="btn-text">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
            Return
          </button>
        </div>
        <h2>Assessment Archives</h2>
        <div id="libraryContent"></div>
      </div>

      <!-- 3. DUEL VIEW -->
      <div id="duelView" class="container view-centered" style="display: none">
        <div class="duel-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
            <line x1="13" x2="19" y1="19" y2="13" />
            <line x1="16" x2="20" y1="16" y2="20" />
            <line x1="19" x2="21" y1="21" y2="19" />
            <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" />
            <line x1="5" x2="9" y1="14" y2="18" />
            <line x1="7" x2="4" y1="17" y2="20" />
            <line x1="3" x2="5" y1="19" y2="21" />
          </svg>
        </div>
        <h1 class="duel-title">Challenge Protocol Invoked</h1>
        <p class="duel-subtitle">
          Participant
          <strong id="duelHostName" class="text-highlight">...</strong> achieved
          a score of
          <strong id="duelHostScore" class="text-highlight">...</strong
          >.<br />Acknowledge and proceed to match?
        </p>

        <div class="card card-minimal">
          <h3 id="duelThemeTitle" class="card-heading-compact">...</h3>
          <p class="card-meta">Items: <span id="duelQCount">...</span></p>
        </div>

        <button type="button" class="btn" data-action="startDuel">
          Engage Protocol
        </button>
      </div>

      <!-- 4. TEST VIEW -->
      <div id="testView" class="view">
        <div class="test-header">
          <button
            type="button"
            id="backBtn"
            class="btn-back"
            data-action="prevQuestion"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
            Previous
          </button>
          <div class="test-indicator">ITEM <span id="qNum">1</span></div>
        </div>

        <div class="progress-div">
          <div
            id="progressBar"
            class="bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
          ></div>
        </div>

        <div class="card card-test">
          <h3 id="qText" class="question-text">...</h3>

          <!-- PSY (Likert 1-5) -->
          <div id="psyContainer" class="likert-grid">
            <button
              type="button"
              class="likert-opt"
              data-value="1"
              aria-label="Strongly Disagree"
              aria-pressed="false"
            >
              <span class="likert-num">1</span
              ><span class="likert-label">Strongly Disagree</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="2"
              aria-label="Disagree"
              aria-pressed="false"
            >
              <span class="likert-num">2</span
              ><span class="likert-label">Disagree</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="3"
              aria-label="Neutral"
              aria-pressed="false"
            >
              <span class="likert-num">3</span
              ><span class="likert-label">Neutral</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="4"
              aria-label="Agree"
              aria-pressed="false"
            >
              <span class="likert-num">4</span
              ><span class="likert-label">Agree</span>
            </button>
            <button
              type="button"
              class="likert-opt"
              data-value="5"
              aria-label="Strongly Agree"
              aria-pressed="false"
            >
              <span class="likert-num">5</span
              ><span class="likert-label">Strongly Agree</span>
            </button>
          </div>

          <!-- QUIZ (Grid) -->
          <div id="quizContainer" class="quiz-grid" style="display: none"></div>
        </div>

        <div id="inProgressActions" class="actions-grid">
          <button
            type="button"
            id="inProgressSaveBtn"
            class="btn btn-secondary"
            data-action="saveTestBtn"
          >
            Store Result
          </button>
          <button
            type="button"
            id="inProgressShareBtn"
            class="btn btn-accent"
            data-action="createShareLink"
          >
            Generate Challenge Link
          </button>
        </div>
      </div>

      <!-- 5. RESULTS VIEW -->
      <div id="resultsView" class="view">
        <div class="card" id="resContent"></div>

        <div class="view-actions-center">
          <button type="button" class="btn-text" onclick="location.reload()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            Initialize New Session
          </button>
        </div>
      </div>
      <div id="toast" role="alert">Link copied to clipboard.</div>
    </div>

    <!-- SCRIPTS -->
    <script type="module" src="./src/app.js"></script>

    <!-- UI Scripts -->
    <script>
      function toggleThemeMenu() {
        const menu = document.getElementById("themeMenu");
        const btn = document.querySelector(".theme-toggle-btn");
        const isActive = menu.classList.toggle("active");

        if (btn) btn.setAttribute("aria-expanded", isActive);

        if (isActive) {
          const firstBtn = menu.querySelector("button");
          if (firstBtn) firstBtn.focus();
          setTimeout(
            () => document.addEventListener("click", closeMenuOutside),
            10,
          );
          document.addEventListener("keydown", handleMenuKeydown);
        } else {
          cleanupMenuListeners();
        }
      }

      function cleanupMenuListeners() {
        document.removeEventListener("click", closeMenuOutside);
        document.removeEventListener("keydown", handleMenuKeydown);
      }

      function closeMenuOutside(e) {
        if (
          !e.target.closest(".theme-menu") &&
          !e.target.closest(".theme-toggle-btn")
        ) {
          closeThemeMenu();
        }
      }

      function handleMenuKeydown(e) {
        if (e.key === "Escape") closeThemeMenu();
      }

      function closeThemeMenu() {
        const menu = document.getElementById("themeMenu");
        const btn = document.querySelector(".theme-toggle-btn");
        if (!menu.classList.contains("active")) return;
        menu.classList.remove("active");
        if (btn) {
          btn.setAttribute("aria-expanded", "false");
          btn.focus();
        }
        cleanupMenuListeners();
      }

      function setTheme(themeName) {
        if (themeName === "light")
          document.body.setAttribute("data-theme", "light");
        else document.body.removeAttribute("data-theme"); // Default dark mode
        localStorage.setItem("aether-user-theme", themeName);
        closeThemeMenu();
      }

      function initTheme() {
        // Default is dark mode. We only apply "light" if explicitly requested.
        const saved = localStorage.getItem("aether-user-theme");
        if (saved === "light") {
          document.body.setAttribute("data-theme", "light");
        }
      }
      initTheme();

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(console.log);
        });
      }
    </script>

    <!-- LOADING OVERLAY -->
    <div
      id="loadingOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="loadingText"
    >
      <div class="loader-ring"></div>
      <h2 id="loadingText" aria-live="assertive" class="loader-text">
        Synthesizing...
      </h2>
    </div>
  </body>
</html>
